<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT PMO – Project Board (Demo)</title>
<style>
/* ===== Design tokens: vibrant palette ===== */
:root {
  --violet: #7c3aed; --indigo: #4f46e5; --sky: #0ea5e9; --teal: #14b8a6;
  --pink: #ec4899; --orange: #f97316; --amber: #f59e0b; --green: #22c55e; --red: #ef4444;
  --ink: #1e1b3a; --ink-soft: #5b5877; --line: #e6e1f5;
  --bg: #f6f3ff; --surface: #ffffff;
  --radius: 18px; --radius-sm: 12px;
  --shadow: 0 2px 6px rgba(79,70,229,0.08), 0 8px 24px rgba(79,70,229,0.10);
  --shadow-lg: 0 12px 32px rgba(79,70,229,0.22);
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --ink: #f1eeff; --ink-soft: #b3aed4; --line: #3a3566; --bg: #14112b; --surface: #211d45; }
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--bg); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }

/* ===== Hero header ===== */
.app-header { position: relative; overflow: hidden; color: #fff; padding: var(--s6) var(--s6) 56px;
  background: linear-gradient(120deg, #4f46e5 0%, #7c3aed 40%, #ec4899 80%, #f97316 100%); }
.app-header::before, .app-header::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255,255,255,0.12); pointer-events: none; }
.app-header::before { width: 320px; height: 320px; right: -80px; top: -140px; }
.app-header::after { width: 200px; height: 200px; left: 38%; bottom: -120px; }
.header-top { position: relative; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s4); }
.wordmark { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; margin: 0; line-height: 1.15; }
.wordmark span { display: block; font-size: 16px; font-weight: 500; opacity: 0.9; letter-spacing: 0; margin-top: 2px; }
.btn { border: 1px solid transparent; border-radius: 999px; padding: 11px 22px; cursor: pointer; font-weight: 700; transition: transform .1s, box-shadow .15s, background .15s; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: linear-gradient(135deg, var(--indigo), var(--violet)); color: #fff; box-shadow: var(--shadow); }
.btn-primary:hover { box-shadow: var(--shadow-lg); }
.btn-primary:disabled { opacity: 0.7; cursor: progress; }
.btn-header { background: #fff; color: var(--violet); box-shadow: 0 6px 18px rgba(0,0,0,0.18); }
.btn-header:hover { transform: translateY(-2px); }
.btn-secondary { background: var(--surface); border-color: var(--line); }
.btn-secondary:hover { background: var(--bg); }
.demo-note { margin: 0; padding: var(--s2) var(--s6); background: #fff7d6; color: #6b4e00; font-size: 13px; text-align: center; }
@media (prefers-color-scheme: dark) { .demo-note { background: #3b3110; color: #fbd987; } }

/* ===== Stat tiles overlapping the hero ===== */
.summary { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--s4); margin: -36px var(--s6) 0; padding: 0; list-style: none; }
.summary li { --c: var(--indigo); background: var(--surface); border-radius: var(--radius); padding: var(--s4); box-shadow: var(--shadow); border-bottom: 5px solid var(--c); display: flex; flex-direction: column; }
.summary li:nth-child(2) { --c: #64748b; } .summary li:nth-child(3) { --c: var(--sky); }
.summary li:nth-child(4) { --c: var(--amber); } .summary li:nth-child(5) { --c: var(--green); } .summary li:nth-child(6) { --c: var(--red); }
.summary strong { font-size: 34px; font-weight: 800; line-height: 1.1; color: var(--c); }
.summary span { font-size: 13px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.05em; }

/* ===== Insights panel ===== */
.insights { margin: var(--s5) var(--s6) 0; display: grid; grid-template-columns: 1.1fr 1fr 1.2fr; gap: var(--s4); }
.panel { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: var(--s5); }
.panel h2 { margin: 0 0 var(--s3); font-size: 15px; font-weight: 800; letter-spacing: 0.02em; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }
.kpi { border-radius: var(--radius-sm); padding: var(--s3); color: #fff; }
.kpi b { display: block; font-size: 26px; line-height: 1.1; font-weight: 800; }
.kpi small { font-size: 12px; opacity: .92; }
.kpi.k1 { background: linear-gradient(135deg, #22c55e, #14b8a6); }
.kpi.k2 { background: linear-gradient(135deg, #ef4444, #f97316); }
.kpi.k3 { background: linear-gradient(135deg, #4f46e5, #0ea5e9); }
.kpi.k4 { background: linear-gradient(135deg, #7c3aed, #ec4899); }
.donut-wrap { display: flex; align-items: center; gap: var(--s5); flex-wrap: wrap; }
.donut { width: 130px; height: 130px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.donut::after { content: attr(data-total); width: 78px; height: 78px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 26px; font-weight: 800; }
.legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
.legend li { display: flex; align-items: center; gap: var(--s2); }
.legend i { width: 12px; height: 12px; border-radius: 4px; background: var(--c); }
.legend b { margin-left: auto; padding-left: var(--s3); }
.bars { display: grid; gap: var(--s3); }
.bar-row { display: grid; grid-template-columns: 96px 1fr 24px; align-items: center; gap: var(--s2); font-size: 14px; }
.bar-track { height: 14px; background: var(--bg); border-radius: 999px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 999px; background: var(--c); transition: width .3s ease; }
.insight-note { margin: var(--s3) 0 0; font-size: 12px; color: var(--ink-soft); }

/* ===== Filters ===== */
.filters { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--s3); margin: var(--s5) var(--s6) 0; padding: var(--s4) var(--s5); background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); }
.filters .field { display: flex; flex-direction: column; gap: var(--s1); }
.filters label { font-size: 13px; font-weight: 700; color: var(--ink-soft); }
.filters input, .filters select { padding: 10px var(--s3); border: 2px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); min-width: 190px; }
.filters input:focus, .filters select:focus { border-color: var(--violet); }

/* ===== Board ===== */
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s5); padding: var(--s5) var(--s6) var(--s6); align-items: start; }
.column { --c1: #64748b; --c2: #94a3b8; --tint: #eef1f6; border: 2px solid transparent; border-radius: var(--radius); background: var(--tint); overflow: hidden; min-height: 220px; }
.column[data-status="In Progress"] { --c1: #4f46e5; --c2: #0ea5e9; --tint: #ecedff; }
.column[data-status="Blocked"] { --c1: #f97316; --c2: #ef4444; --tint: #fff0e6; }
.column[data-status="Done"] { --c1: #16a34a; --c2: #14b8a6; --tint: #e5f8ec; }
@media (prefers-color-scheme: dark) {
  .column { --tint: #1d1a3d; }
  .column[data-status="In Progress"] { --tint: #1c2050; } .column[data-status="Blocked"] { --tint: #3a2218; } .column[data-status="Done"] { --tint: #173628; }
}
.column.drop-target { border-color: var(--c1); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c1) 25%, transparent); }
.column-header { display: flex; justify-content: space-between; align-items: center; padding: var(--s3) var(--s4); background: linear-gradient(120deg, var(--c1), var(--c2)); color: #fff; }
.column-header h2 { margin: 0; font-size: 17px; font-weight: 800; }
.count-badge { background: rgba(255,255,255,0.25); border-radius: 999px; padding: 1px 12px; font-size: 14px; font-weight: 800; }
.column-body { display: flex; flex-direction: column; gap: var(--s3); min-height: 80px; padding: var(--s3); }
.empty { color: var(--ink-soft); font-size: 14px; text-align: center; padding: var(--s5) var(--s4); border: 2px dashed var(--line); border-radius: var(--radius-sm); }

/* ===== Cards ===== */
.card { --p: var(--slate, #94a3b8); background: var(--surface); border-radius: var(--radius-sm); padding: var(--s4); box-shadow: var(--shadow); cursor: grab; border-top: 5px solid var(--p); transition: box-shadow .15s, transform .15s; }
.card.prio-critical { --p: var(--red); } .card.prio-high { --p: var(--orange); } .card.prio-medium { --p: var(--sky); } .card.prio-low { --p: #a8a3c7; }
.card:hover { box-shadow: var(--shadow-lg); transform: translateY(-3px) rotate(-0.4deg); }
.card.dragging { opacity: 0.45; }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); font-size: 12px; color: var(--ink-soft); }
.card-id { font-weight: 600; font-family: ui-monospace, Menlo, Consolas, monospace; }
.card-title { margin: var(--s2) 0 var(--s1); font-size: 16px; font-weight: 800; line-height: 1.35; overflow-wrap: anywhere; }
.card-project { margin: 0 0 var(--s3); font-size: 13px; color: var(--ink-soft); overflow-wrap: anywhere; }
.card-meta { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); flex-wrap: wrap; font-size: 13px; }
.assignee { display: flex; align-items: center; gap: var(--s2); min-width: 0; font-weight: 600; }
.avatar { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--av, var(--indigo)); color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 800; }
.due { color: var(--ink-soft); font-weight: 700; white-space: nowrap; }
.due.soon { color: #c2410c; } .due.late { color: var(--red); }
.card-tags { display: flex; flex-wrap: wrap; gap: var(--s1); margin: var(--s3) 0; }
.pill, .tag, .overdue-badge { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 800; }
.pill { background: color-mix(in srgb, var(--p) 16%, transparent); color: var(--p); }
.pill-low { color: var(--ink-soft); }
.pill::before { content: "● "; font-size: 9px; vertical-align: 1px; }
.tag { background: var(--bg); color: var(--violet); }
.overdue-badge { background: var(--red); color: #fff; }
.card-actions { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); padding-top: var(--s3); border-top: 1px dashed var(--line); }
.move-select { padding: 5px var(--s2); border: 2px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 13px; max-width: 130px; cursor: pointer; }
.icon-btn { border: 1px solid transparent; background: transparent; border-radius: 8px; width: 32px; height: 32px; cursor: pointer; font-size: 20px; line-height: 1; color: var(--ink-soft); }
.icon-btn:hover { background: #fee2e2; color: var(--red); }
.confirm { display: flex; align-items: center; gap: var(--s2); font-size: 13px; font-weight: 700; color: var(--red); }
.confirm button { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 3px var(--s3); cursor: pointer; font-size: 13px; }
.confirm button.yes { background: var(--red); color: #fff; border-color: var(--red); }

/* ===== Modal form ===== */
dialog { border: none; border-radius: var(--radius); padding: 0; width: min(580px, calc(100vw - 32px)); box-shadow: var(--shadow-lg); background: var(--surface); color: var(--ink); overflow: hidden; }
dialog::backdrop { background: rgba(30,27,58,0.6); }
.dialog-head { background: linear-gradient(120deg, var(--indigo), var(--violet), var(--pink)); color: #fff; padding: var(--s4) var(--s5); display: flex; justify-content: space-between; align-items: center; }
.dialog-head h2 { margin: 0; font-size: 18px; }
.dialog-head .icon-btn { color: #fff; }
.dialog-head .icon-btn:hover { background: rgba(255,255,255,0.25); color: #fff; }
form { padding: var(--s5); display: grid; grid-template-columns: 1fr 1fr; gap: var(--s4); max-height: 80vh; overflow-y: auto; }
.form-field { display: flex; flex-direction: column; gap: var(--s1); }
.form-field.full { grid-column: 1 / -1; }
.form-field label { font-weight: 700; font-size: 13px; }
.req { color: var(--red); }
.form-field input, .form-field select, .form-field textarea { padding: 10px var(--s3); border: 2px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); width: 100%; }
.form-field textarea { resize: vertical; min-height: 80px; }
.form-field [aria-invalid="true"] { border-color: var(--red); background: #fee2e2; color: #111; }
.error { color: var(--red); font-size: 13px; min-height: 0; }
.form-actions { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: var(--s2); }

/* ===== Toasts ===== */
.toast-region { position: fixed; bottom: var(--s4); right: var(--s4); display: flex; flex-direction: column; gap: var(--s2); z-index: 1000; max-width: calc(100vw - 32px); }
.toast { background: var(--ink); color: var(--bg); padding: var(--s3) var(--s4); border-radius: var(--radius-sm); box-shadow: var(--shadow-lg); border-left: 6px solid var(--green); font-size: 14px; }
.toast.warn { border-left-color: var(--amber); }
.toast::before { content: "\2713  "; font-weight: 700; }
.toast.warn::before { content: "\26A0  "; }

/* ===== Responsive ===== */
@media (max-width: 1100px) {
  .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .summary { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .insights { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .board { grid-template-columns: 1fr; padding: var(--s4); }
  .app-header { padding: var(--s5) var(--s4) 56px; }
  .summary, .insights, .filters { margin-left: var(--s4); margin-right: var(--s4); }
  .demo-note { padding: var(--s2) var(--s4); }
  .wordmark { font-size: 28px; }
  form { grid-template-columns: 1fr; }
  .filters .field, .filters input, .filters select { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } .card:hover { transform: none; } }
</style>
</head>
<body>

<!-- ===== Header: wordmark, live summary strip, Add Task button ===== -->
<p class="demo-note">Demo / training tool. Board data lives in memory only — refreshing the page resets it to the seeded demo tasks.</p>
<header class="app-header">
  <div class="header-top">
    <h1 class="wordmark">IT PMO<span>Project Board · plan, track, deliver</span></h1>
    <button type="button" class="btn btn-header" id="openForm">+ Add Task</button>
  </div>
</header>
<ul class="summary" id="summary" aria-label="Board summary"></ul>

<!-- ===== Insights (descriptive statistics over all tasks) ===== -->
<section class="insights" id="insights" aria-label="Board insights"></section>

<!-- ===== Filter bar ===== -->
<section class="filters" aria-label="Board filters">
  <div class="field">
    <label for="fProject">Project</label>
    <select id="fProject"></select>
  </div>
  <div class="field">
    <label for="fAssignee">Assignee contains</label>
    <input type="text" id="fAssignee" placeholder="e.g. Tan">
  </div>
  <div class="field">
    <label for="fPriority">Priority</label>
    <select id="fPriority"></select>
  </div>
  <button type="button" class="btn btn-secondary" id="clearFilters">Clear filters</button>
</section>

<!-- ===== Kanban board (columns rendered by renderBoard) ===== -->
<main class="board" id="board" aria-label="Kanban board"></main>

<!-- ===== Add Task modal ===== -->
<dialog id="taskDialog" aria-labelledby="dialogTitle">
  <div class="dialog-head">
    <h2 id="dialogTitle">Add Task</h2>
    <button type="button" class="icon-btn" id="closeForm" aria-label="Close form">&times;</button>
  </div>
  <form id="taskForm" novalidate>
    <div class="form-field full">
      <label for="title">Task Title <span class="req">*</span></label>
      <input type="text" id="title" name="title" maxlength="80" aria-describedby="err-title">
      <span class="error" id="err-title" role="alert"></span>
    </div>
    <div class="form-field full">
      <label for="description">Description</label>
      <textarea id="description" name="description" maxlength="500" aria-describedby="err-description"></textarea>
      <span class="error" id="err-description" role="alert"></span>
    </div>
    <div class="form-field">
      <label for="project">Project / Workstream</label>
      <select id="project" name="project"></select>
      <span class="error" id="err-project" role="alert"></span>
    </div>
    <div class="form-field">
      <label for="category">Category</label>
      <select id="category" name="category"></select>
      <span class="error" id="err-category" role="alert"></span>
    </div>
    <div class="form-field">
      <label for="assignee">Assignee <span class="req">*</span></label>
      <input type="text" id="assignee" name="assignee" maxlength="60" aria-describedby="err-assignee">
      <span class="error" id="err-assignee" role="alert"></span>
    </div>
    <div class="form-field">
      <label for="priority">Priority</label>
      <select id="priority" name="priority"></select>
      <span class="error" id="err-priority" role="alert"></span>
    </div>
    <div class="form-field">
      <label for="dueDate">Due Date <span class="req">*</span></label>
      <input type="date" id="dueDate" name="dueDate" aria-describedby="err-dueDate">
      <span class="error" id="err-dueDate" role="alert"></span>
    </div>
    <div class="form-field">
      <label for="status">Status</label>
      <select id="status" name="status"></select>
      <span class="error" id="err-status" role="alert"></span>
    </div>
    <div class="form-actions">
      <button type="button" class="btn btn-secondary" id="cancelForm">Cancel</button>
      <button type="submit" class="btn btn-primary" id="submitBtn">Add Task</button>
    </div>
  </form>
</dialog>

<!-- Toast region: announced politely by screen readers -->
<div class="toast-region" id="toasts" aria-live="polite"></div>

<script>
"use strict";

/* ===================================================================
   CONFIG
   -------------------------------------------------------------------
   FormSubmit requires a ONE-TIME ACTIVATION: the first submission sent
   to this address triggers a confirmation email to it. Submissions are
   only delivered after the link in that email is clicked.
   Swap the email address below (the only place it is used).
   =================================================================== */
const FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/YOUR_EMAIL@example.com";

/* ===================================================================
   CONSTANTS: fixed lists used for columns, selects and validation
   =================================================================== */
const STATUSES = ["Backlog", "In Progress", "Blocked", "Done"];
const PROJECTS = ["Core Banking Upgrade", "Digital Channels", "Cybersecurity Uplift", "Data & Analytics", "Infrastructure & Cloud", "Vendor Management"];
const CATEGORIES = ["Application Development", "Infrastructure", "Cybersecurity", "Data", "Compliance", "Vendor"];
const PRIORITIES = ["Critical", "High", "Medium", "Low"];

/* ===================================================================
   STATE: single source of truth (in memory only, no storage APIs)
   =================================================================== */
const state = { tasks: [], filters: { project: "", assignee: "", priority: "" } };
const ui = { pendingDeleteId: null, draggingId: null, nextId: 1, sending: false };

/* ===================================================================
   HELPERS
   =================================================================== */
// Escape user-supplied strings before they go into HTML
function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Local date as YYYY-MM-DD (string comparison works for ISO dates)
function dateString(d) {
  const p = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function todayString() { return dateString(new Date()); }
function offsetDate(days) { const d = new Date(); d.setDate(d.getDate() + days); return dateString(d); }

function isOverdue(task) { return task.status !== "Done" && task.dueDate < todayString(); }
function formatId(n) { return "UOB-ITPM-" + String(n).padStart(4, "0"); }
function slug(s) { return s.toLowerCase(); }
const AVATAR_COLORS = ["#4f46e5", "#ec4899", "#0ea5e9", "#f97316", "#14b8a6", "#7c3aed", "#16a34a", "#e11d48"];
function avatarColor(name) { let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return AVATAR_COLORS[h % AVATAR_COLORS.length]; }
function median(nums) { if (!nums.length) return 0; const s = nums.slice().sort((a, b) => a - b); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }
function mean(nums) { return nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : 0; }
function initials(name) { return name.trim().split(/\s+/).slice(0, 2).map((w) => w[0].toUpperCase()).join(""); }
function daysUntil(task) {
  const [y, m, d] = task.dueDate.split("-").map(Number);
  const t = new Date();
  return Math.round((new Date(y, m - 1, d) - new Date(t.getFullYear(), t.getMonth(), t.getDate())) / 86400000);
}
function dueLabel(task) {
  const n = daysUntil(task);
  const date = new Date(task.dueDate + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" });
  if (task.status === "Done") return "Done · " + date;
  if (n < 0) return date + " · " + -n + (n === -1 ? " day late" : " days late");
  if (n === 0) return date + " · today";
  return date + " · in " + n + (n === 1 ? " day" : " days");
}
function dueClass(task) {
  if (task.status === "Done") return "";
  const n = daysUntil(task);
  return n < 0 ? "late" : n <= 7 ? "soon" : "";
}

/* ===================================================================
   SEED DATA: 8 demo tasks (due dates relative to today)
   =================================================================== */
function seedTasks() {
  const rows = [
    ["Migrate FX pricing service to AWS", "Lift and shift the FX pricing microservices to the new landing zone.", "Infrastructure & Cloud", "Infrastructure", "Priya Nair", "High", 21, "In Progress"],
    ["Patch CVE-2025-XXXX on branch teller VDI", "Roll out vendor patch to all branch teller virtual desktops.", "Cybersecurity Uplift", "Cybersecurity", "Marcus Tan", "Critical", -2, "In Progress"],
    ["UAT sign-off for mobile onboarding release 4.2", "Collect business sign-off for the eKYC onboarding flow.", "Digital Channels", "Application Development", "Aisha Rahman", "High", 5, "In Progress"],
    ["Renew core banking vendor support contract", "Awaiting legal review of revised SLA terms.", "Vendor Management", "Vendor", "Daniel Lim", "Medium", 12, "Blocked"],
    ["Build regulatory reporting data mart", "Design star schema for monthly liquidity reports.", "Data & Analytics", "Data", "Chen Wei", "Medium", 45, "Backlog"],
    ["Quarterly access recertification", "Complete user access review for core banking admins.", "Cybersecurity Uplift", "Compliance", "Sofia Hernandez", "Low", 30, "Backlog"],
    ["Core banking DB upgrade – rehearsal 2", "Awaiting DR environment from infrastructure team.", "Core Banking Upgrade", "Infrastructure", "Ravi Kumar", "Critical", -5, "Blocked"],
    ["Decommission legacy SMS gateway", "Gateway retired and monitoring removed.", "Digital Channels", "Infrastructure", "Grace Ong", "Low", -10, "Done"]
  ];
  state.tasks = rows.map((r) => ({
    id: formatId(ui.nextId++), title: r[0], description: r[1], project: r[2], category: r[3],
    assignee: r[4], priority: r[5], dueDate: offsetDate(r[6]), status: r[7]
  }));
}

/* ===================================================================
   FILTERING
   =================================================================== */
function applyFilters(tasks) {
  const f = state.filters;
  const needle = f.assignee.trim().toLowerCase();
  return tasks.filter((t) =>
    (!f.project || t.project === f.project) &&
    (!f.priority || t.priority === f.priority) &&
    (!needle || t.assignee.toLowerCase().includes(needle))
  );
}

/* ===================================================================
   RENDERING (the only place card/column DOM is built)
   =================================================================== */
function renderCard(task) {
  const overdue = isOverdue(task);
  const moveOptions = STATUSES.filter((s) => s !== task.status)
    .map((s) => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join("");
  const actions = ui.pendingDeleteId === task.id
    ? `<div class="confirm" role="group" aria-label="Confirm delete ${escapeHtml(task.id)}">
         <span>Delete?</span>
         <button type="button" class="yes" data-action="delete-yes" data-id="${escapeHtml(task.id)}">Yes</button>
         <button type="button" data-action="delete-no" data-id="${escapeHtml(task.id)}">No</button>
       </div>`
    : `<button type="button" class="icon-btn" data-action="delete" data-id="${escapeHtml(task.id)}" aria-label="Delete task ${escapeHtml(task.id)}">&times;</button>`;
  return `
    <article class="card" draggable="true" data-id="${escapeHtml(task.id)}" aria-label="${escapeHtml(task.id)}: ${escapeHtml(task.title)}">
      <div class="card-top">
        <span class="card-id">${escapeHtml(task.id)}</span>
        <span class="pill pill-${slug(task.priority)}">${escapeHtml(task.priority)}</span>
      </div>
      <h3 class="card-title">${escapeHtml(task.title)}</h3>
      <p class="card-project">${escapeHtml(task.project)}</p>
      <div class="card-meta">
        <span class="assignee"><span class="avatar" style="--av:${avatarColor(task.assignee)}" aria-hidden="true">${escapeHtml(initials(task.assignee))}</span>${escapeHtml(task.assignee)}</span>
        <span class="due ${dueClass(task)}">${escapeHtml(dueLabel(task))}</span>
      </div>
      <div class="card-tags">
        <span class="tag">${escapeHtml(task.category)}</span>
        ${overdue ? '<span class="overdue-badge">Overdue</span>' : ""}
      </div>
      <div class="card-actions">
        <select class="move-select" data-action="move" data-id="${escapeHtml(task.id)}" aria-label="Move task ${escapeHtml(task.id)} to another column">
          <option value="">Move to…</option>${moveOptions}
        </select>
        ${actions}
      </div>
    </article>`;
}

function renderSummary() {
  const tile = (n, label) => `<li><strong>${n}</strong><span>${escapeHtml(label)}</span></li>`;
  const parts = [tile(state.tasks.length, "Total")];
  STATUSES.forEach((s) => parts.push(tile(state.tasks.filter((t) => t.status === s).length, s)));
  parts.push(tile(state.tasks.filter(isOverdue).length, "Overdue"));
  document.getElementById("summary").innerHTML = parts.join("");
  renderInsights();
}

// Descriptive statistics over ALL tasks (not the filtered view). Median and mean are
// shown together because the gap reveals skew; n is small so results are indicative only.
const PRIORITY_COLORS = { Critical: "#ef4444", High: "#f97316", Medium: "#0ea5e9", Low: "#a8a3c7" };
const STATUS_COLORS = { "Backlog": "#64748b", "In Progress": "#4f46e5", "Blocked": "#f97316", "Done": "#16a34a" };
function renderInsights() {
  const all = state.tasks, total = all.length;
  const open = all.filter((t) => t.status !== "Done");
  const done = total - open.length;
  const overdue = all.filter(isOverdue).length;
  const days = open.map(daysUntil);
  const pct = (n, d) => (d ? Math.round((n / d) * 100) : 0);
  const fmt = (n) => (Number.isInteger(n) ? n : n.toFixed(1));

  const gradient = (() => {
    let acc = 0;
    const stops = PRIORITIES.map((p) => {
      const share = total ? (all.filter((t) => t.priority === p).length / total) * 100 : 0;
      const s = `${PRIORITY_COLORS[p]} ${acc}% ${acc + share}%`; acc += share; return s;
    });
    return total ? stops.join(", ") : "var(--line) 0 100%";
  })();
  const legend = PRIORITIES.map((p) =>
    `<li style="--c:${PRIORITY_COLORS[p]}"><i></i>${escapeHtml(p)}<b>${all.filter((t) => t.priority === p).length}</b></li>`).join("");
  const bars = STATUSES.map((s) => {
    const n = all.filter((t) => t.status === s).length;
    return `<div class="bar-row" style="--c:${STATUS_COLORS[s]}"><span>${escapeHtml(s)}</span><div class="bar-track"><div class="bar-fill" style="width:${pct(n, total)}%"></div></div><b>${n}</b></div>`;
  }).join("");

  document.getElementById("insights").innerHTML = `
    <div class="panel"><h2>Key numbers</h2><div class="kpis">
      <div class="kpi k1"><b>${pct(done, total)}%</b><small>Completion rate</small></div>
      <div class="kpi k2"><b>${pct(overdue, open.length)}%</b><small>Open tasks overdue</small></div>
      <div class="kpi k3"><b>${fmt(median(days))} d</b><small>Median days to due (open)</small></div>
      <div class="kpi k4"><b>${fmt(mean(days))} d</b><small>Mean days to due (open)</small></div>
    </div><p class="insight-note">Median vs mean gap shows skew from far-off deadlines. Based on ${total} tasks — indicative only.</p></div>
    <div class="panel"><h2>Priority mix</h2><div class="donut-wrap">
      <div class="donut" data-total="${total}" style="background:conic-gradient(${gradient})" role="img" aria-label="Priority mix of ${total} tasks"></div>
      <ul class="legend">${legend}</ul></div></div>
    <div class="panel"><h2>Tasks by status</h2><div class="bars">${bars}</div></div>`;
}

function renderBoard() {
  const visible = applyFilters(state.tasks);
  const html = STATUSES.map((status) => {
    const cards = visible.filter((t) => t.status === status);
    return `
      <section class="column" data-status="${escapeHtml(status)}" aria-labelledby="col-${slug(status).replace(/\s/g, "-")}">
        <div class="column-header">
          <h2 id="col-${slug(status).replace(/\s/g, "-")}">${escapeHtml(status)}</h2>
          <span class="count-badge" aria-label="${cards.length} tasks">${cards.length}</span>
        </div>
        <div class="column-body">
          ${cards.length ? cards.map(renderCard).join("") : '<div class="empty">No tasks</div>'}
        </div>
      </section>`;
  }).join("");
  document.getElementById("board").innerHTML = html;
  renderSummary();
}

/* ===================================================================
   TASK ACTIONS: add / move / delete (state first, then re-render)
   =================================================================== */
function addTask(data) {
  const task = Object.assign({ id: formatId(ui.nextId++) }, data);
  state.tasks.push(task);
  renderBoard();
  return task;
}

function moveTask(id, newStatus) {
  const task = state.tasks.find((t) => t.id === id);
  if (!task || !STATUSES.includes(newStatus) || task.status === newStatus) return;
  task.status = newStatus;
  renderBoard();
}

function deleteTask(id) {
  state.tasks = state.tasks.filter((t) => t.id !== id);
  ui.pendingDeleteId = null;
  renderBoard();
}

/* ===================================================================
   TOASTS
   =================================================================== */
function showToast(message, type) {
  const el = document.createElement("div");
  el.className = "toast" + (type === "warn" ? " warn" : "");
  el.textContent = message;
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => el.remove(), type === "warn" ? 6000 : 3500);
}

/* ===================================================================
   FORMSUBMIT NOTIFICATION (never allowed to break the board)
   =================================================================== */
async function notifyNewTask(task) {
  const res = await fetch(FORMSUBMIT_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json", Accept: "application/json" },
    body: JSON.stringify({
      _subject: `[UOB IT PMO] New task ${task.id}: ${task.title}`,
      _template: "table",
      _captcha: "false",
      "Task ID": task.id,
      Title: task.title,
      Description: task.description,
      Project: task.project,
      Category: task.category,
      Assignee: task.assignee,
      Priority: task.priority,
      "Due Date": task.dueDate,
      Status: task.status,
      "Submitted At": new Date().toISOString(),
    }),
  });
  if (!res.ok) throw new Error(`FormSubmit failed: ${res.status}`);
  return res.json();
}

/* ===================================================================
   FORM: validation + submit
   =================================================================== */
const form = document.getElementById("taskForm");
const dialog = document.getElementById("taskDialog");
const submitBtn = document.getElementById("submitBtn");
const FIELD_NAMES = ["title", "description", "project", "category", "assignee", "priority", "dueDate", "status"];

function readForm() {
  const data = {};
  FIELD_NAMES.forEach((n) => { data[n] = form.elements[n].value.trim(); });
  return data;
}

function validate(data) {
  const errors = {};
  if (!data.title) errors.title = "Task title is required.";
  else if (data.title.length > 80) errors.title = "Title must be 80 characters or fewer.";
  if (data.description.length > 500) errors.description = "Description must be 500 characters or fewer.";
  if (!PROJECTS.includes(data.project)) errors.project = "Choose a project.";
  if (!CATEGORIES.includes(data.category)) errors.category = "Choose a category.";
  if (!data.assignee) errors.assignee = "Assignee is required.";
  if (!PRIORITIES.includes(data.priority)) errors.priority = "Choose a priority.";
  if (!data.dueDate) errors.dueDate = "Due date is required.";
  else if (data.dueDate < todayString()) errors.dueDate = "Due date cannot be in the past.";
  if (!STATUSES.includes(data.status)) errors.status = "Choose a status.";
  return errors;
}

function showErrors(errors) {
  FIELD_NAMES.forEach((n) => {
    const input = form.elements[n];
    const msg = errors[n] || "";
    document.getElementById("err-" + n).textContent = msg;
    if (msg) input.setAttribute("aria-invalid", "true"); else input.removeAttribute("aria-invalid");
  });
}

function resetForm() {
  form.reset();
  form.elements.priority.value = "Medium";
  form.elements.status.value = "Backlog";
  showErrors({});
}

async function handleSubmit(event) {
  event.preventDefault();
  if (ui.sending) return;
  const data = readForm();
  const errors = validate(data);
  showErrors(errors);
  const firstBad = FIELD_NAMES.find((n) => errors[n]);
  if (firstBad) { form.elements[firstBad].focus(); return; }

  // Optimistic UI: card appears immediately, notification happens in parallel
  const task = addTask(data);
  resetForm();
  ui.sending = true;
  submitBtn.disabled = true;
  submitBtn.textContent = "Sending…";

  let emailOk = true;
  try {
    await notifyNewTask(task);
  } catch (err) {
    emailOk = false;
  }

  ui.sending = false;
  submitBtn.disabled = false;
  submitBtn.textContent = "Add Task";
  dialog.close();
  if (emailOk) showToast(`Task ${task.id} added and notification sent.`);
  else showToast("Card added locally — email notification failed", "warn");
}

/* ===================================================================
   SETUP: populate selects, wire events
   =================================================================== */
function fillSelect(select, values, placeholder) {
  const opts = (placeholder ? [`<option value="">${escapeHtml(placeholder)}</option>`] : [])
    .concat(values.map((v) => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`));
  select.innerHTML = opts.join("");
}

function setupControls() {
  fillSelect(document.getElementById("fProject"), PROJECTS, "All projects");
  fillSelect(document.getElementById("fPriority"), PRIORITIES, "All priorities");
  fillSelect(form.elements.project, PROJECTS);
  fillSelect(form.elements.category, CATEGORIES);
  fillSelect(form.elements.priority, PRIORITIES);
  fillSelect(form.elements.status, STATUSES);
  resetForm();

  // Filters re-render the board from state
  const onFilter = () => {
    state.filters.project = document.getElementById("fProject").value;
    state.filters.assignee = document.getElementById("fAssignee").value;
    state.filters.priority = document.getElementById("fPriority").value;
    renderBoard();
  };
  ["fProject", "fAssignee", "fPriority"].forEach((id) => {
    document.getElementById(id).addEventListener("input", onFilter);
  });
  document.getElementById("clearFilters").addEventListener("click", () => {
    document.getElementById("fProject").value = "";
    document.getElementById("fAssignee").value = "";
    document.getElementById("fPriority").value = "";
    onFilter();
  });

  // Modal open/close
  document.getElementById("openForm").addEventListener("click", () => {
    form.elements.dueDate.min = todayString();
    dialog.showModal();
    form.elements.title.focus();
  });
  const closeDialog = () => { if (!ui.sending) dialog.close(); };
  document.getElementById("closeForm").addEventListener("click", closeDialog);
  document.getElementById("cancelForm").addEventListener("click", closeDialog);
  dialog.addEventListener("cancel", (e) => { if (ui.sending) e.preventDefault(); });
  form.addEventListener("submit", handleSubmit);

  setupBoardEvents();
}

// Event delegation on the board: clicks, move select, drag and drop
function setupBoardEvents() {
  const board = document.getElementById("board");

  board.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    const id = btn.dataset.id;
    if (btn.dataset.action === "delete") { ui.pendingDeleteId = id; renderBoard(); focusCardControl(id, "delete-yes"); }
    else if (btn.dataset.action === "delete-no") { ui.pendingDeleteId = null; renderBoard(); focusCardControl(id, "delete"); }
    else if (btn.dataset.action === "delete-yes") { deleteTask(id); }
  });

  board.addEventListener("change", (e) => {
    const sel = e.target.closest('[data-action="move"]');
    if (sel && sel.value) moveTask(sel.dataset.id, sel.value);
  });

  board.addEventListener("dragstart", (e) => {
    const card = e.target.closest(".card");
    if (!card) return;
    ui.draggingId = card.dataset.id;
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", card.dataset.id);
    card.classList.add("dragging");
  });
  board.addEventListener("dragend", () => {
    ui.draggingId = null;
    board.querySelectorAll(".dragging, .drop-target").forEach((el) => el.classList.remove("dragging", "drop-target"));
  });
  board.addEventListener("dragover", (e) => {
    const col = e.target.closest(".column");
    if (!col || !ui.draggingId) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    board.querySelectorAll(".drop-target").forEach((el) => { if (el !== col) el.classList.remove("drop-target"); });
    col.classList.add("drop-target");
  });
  board.addEventListener("dragleave", (e) => {
    const col = e.target.closest(".column");
    if (col && !col.contains(e.relatedTarget)) col.classList.remove("drop-target");
  });
  board.addEventListener("drop", (e) => {
    const col = e.target.closest(".column");
    if (!col || !ui.draggingId) return;
    e.preventDefault();
    const id = ui.draggingId;
    ui.draggingId = null;
    moveTask(id, col.dataset.status);
  });
}

// Restore keyboard focus to the relevant control after a delete-confirm re-render
function focusCardControl(id, action) {
  const el = document.querySelector(`[data-action="${action}"][data-id="${CSS.escape(id)}"]`);
  if (el) el.focus();
}

/* ===================================================================
   INIT
   =================================================================== */
seedTasks();
setupControls();
renderBoard();
</script>
